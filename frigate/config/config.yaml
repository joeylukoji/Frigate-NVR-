mqtt:
  enabled: false

cameras:
  webcam_pc: # Webcam USB branchée sur l'hôte
    enabled: true
    ffmpeg:
      inputs:
        - path: /dev/video0
          input_args: -f v4l2 -input_format yuyv422 -framerate 30
          roles:
            - detect
    detect:
      enabled: true
      width: 1280 # À adapter selon les capacités de la webcam
      height: 720
      fps: 5 # Frigate recommande 5 fps pour la détection

version: 0.15-1
